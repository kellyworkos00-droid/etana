<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eterna Offline</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(145deg, #fff1f2, #ffffff);
        color: #3f3f46;
      }
      .card {
        width: min(92vw, 430px);
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid #fecdd3;
        border-radius: 18px;
        padding: 24px;
        text-align: center;
        box-shadow: 0 18px 45px rgba(190, 18, 60, 0.12);
      }
      h1 {
        margin: 14px 0 10px;
        font-size: 1.4rem;
        color: #9f1239;
      }
      p {
        margin: 0;
        line-height: 1.55;
      }
      img {
        width: 110px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/logo.png" alt="Eterna logo" />
      <h1>You are offline</h1>
      <p>Connection is unavailable right now. Please reconnect and reload to continue shopping.</p>
    </main>
  </body>
</html>
